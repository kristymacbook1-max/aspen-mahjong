    authority: "Phase E Gate 9 Q9.7; §195(b)/§248(a)/§709(b)"
    ask_when: "Q9_7a"

  - id: Q9.7c
    gate: 9
    question: "Date the active trade or business began (amortization start)?"
    answer_type: str
    maps_to: schedule.business_commencement_date
    kind: FACT
    authority: "Phase E Gate 9 Q9.7; §195(c)(2)"
    ask_when: "Q9_7a"

  - id: Q9.8
    gate: 9
    question: "(Partnerships) Any portion representing SYNDICATION costs under §709(b) (fees to promote/sell partnership interests)?"
    answer_type: bool
    maps_to: flag.SYNDICATION_COSTS
    kind: FACT
    authority: "Phase E Gate 9 Q9.8; §709(b)"
    ask_when: "Q9_7a and Q0_1 == 'partnership'"
    warning_if_true: "SYNDICATION-PERMANENT-NONAMORTIZATION"
    consequence: "If yes: PERMANENT non-amortization, not the $5,000/180-month schedule."

  - id: Q9.9a
    gate: 9
    question: "Acquired a trade or business this year (asset acquisition or deemed asset acquisition under §338)?"
    answer_type: bool
    maps_to: flag.ACQUIRED_TRADE_OR_BUSINESS
