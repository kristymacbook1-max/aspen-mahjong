    answer_type: per_item
    maps_to: schedule.ppa
    kind: FACT
    authority: "Phase E Gate 9 Q9.9; §1060; Form 8594"
    ask_when: "Q9_9a"

  - id: Q9.10
    gate: 9
    question: "(Per structure demolished this year) Demolition triggered by casualty (Notice 90-21 carve-out) or a voluntary redevelopment decision?"
    answer_type: per_item
    maps_to: none
    kind: FACT
    authority: "Phase E Gate 9 Q9.10 (ADDED 2026-07-09); §280B; Notice 90-21"
    ask_when: "True"
    consequence: >-
      If voluntary: demolition cost + remaining undepreciated basis routes to the
      LAND AmortizableItem (non-depreciable), never to a deductible loss.

