# Phase E interview question graph — one node per numbered question in
# BUILD_PLAN.md "Phase E — Interview layer" Gates 0-10.
#
# CONVENTIONS (documented per the build plan):
#   * Multi-part plan questions are split into lettered sub-ids: e.g. the plan's
#     Q1.1 ("Produces? Acquires for resale?") becomes Q1.1a (produces) and
#     Q1.1b (acquires_for_resale); Q2.7 becomes Q2.7a/Q2.7b; Q3.18 becomes
#     Q3.18a/Q3.18b; Q4.1 becomes Q4.1a/Q4.1b/Q4.1c; etc.
#   * Gates whose plan text says "ask if <collection> exists" get a synthetic
#     presence-screen node with suffix .0 (Q6.0, Q7.0, Q8.0, Q9.0). Gate 10's
#     screen is the plan's own Q10.1.
#   * ask_when expressions are python-ish boolean expressions over PRIOR
#     answers. Question ids are exposed with dots mapped to underscores
#     (Q0.1 -> Q0_1, Q1.1a -> Q1_1a). Unanswered/never-asked questions
#     evaluate as None (falsy). Three DERIVED names are also available:
#       small_business_exempt  - §448(c) exemption from Q0.2/Q0.3/Q0.4
#       under_448c_threshold   - Q0.4 <= the §448(c) threshold for Q0.2's year
#       srm_available          - Gate 1 consequence matrix (computed, not asked)
#   * answer_type per_item marks a sub-tree asked once per item of its
#     collection (per facility / per asset / per unit / per debt instrument /
#     per project / per transaction); the runner receives a LIST of per-item
#     answer dicts for such nodes.
#   * maps_to targets: profile.<field> (validated against EntityProfile),
#     schedule.<name>, flag.<NAME>, or none.
#   * warning_if_true: warning code the runner emits when the node's answer is
#     truthy (True, or a non-empty per_item list).
#   * Cross-gate ordering note (plan's Gate 5 ORDERING NOTE): for an asset
#     flagged in BOTH Gate 5 and Gate 7, the Gate 5 election is logically
#     dependent on Gate 7's per-unit determination — treat as an ask_when
#     dependency, not a strict linear walk; the linear document order here is
#     the default presentation order only.

version: 1

questions:

  # ---------------------------------------------------------------- Gate 0 --
  - id: Q0.1
    gate: 0
    question: "Entity type?"
    answer_type: enum
    choices: [c_corp, s_corp, partnership, sole_prop]
    maps_to: profile.entity_type
    kind: FACT
    authority: "Phase E Gate 0 Q0.1; §448; unlocks §707(c) questions (Q7.23) for partnerships"
    ask_when: "True"
    consequence: "Determines who signs elections; partnership unlocks guaranteed-payment questions in Gate 7."

  - id: Q0.2
    gate: 0
    question: "Tax year?"
    answer_type: int
    maps_to: profile.tax_year
    kind: FACT
    authority: "Phase E Gate 0 Q0.2; §448(c) threshold lookup; T.D. 10034 pre/post-Oct-2025 regime"
    ask_when: "True"

  - id: Q0.3
    gate: 0
    question: "Is the taxpayer a tax shelter under §448(a)(3) (syndicate/loss-allocation tests)?"
    answer_type: bool
    maps_to: profile.is_tax_shelter
    kind: FACT
    authority: "Phase E Gate 0 Q0.3; §448(a)(3); §1.263A-1(b)(1)/(j)"
    ask_when: "True"
    consequence: "If yes: small-business exemption barred regardless of receipts."

  - id: Q0.4
    gate: 0
    question: "Aggregated 3-yr average gross receipts under §448(c)(2)/§1.448-2 (single-employer aggregation)?"
    answer_type: decimal
    maps_to: profile.avg_gross_receipts
    kind: FACT
    authority: "Phase E Gate 0 Q0.4; §448(c)(2); §1.448-2"
    ask_when: "True"
    consequence: >-
      If <= threshold and not Q0.3: small_business_exempt — skip Gates 1, 2, 3, 6, 7
      entirely (all §263A off, including (f)); Gates 4, 5, 8, 9, 10 still run
      (§263(a)/§266/§174/§1060/§59(e) are not §263A provisions).

  - id: Q0.5
    gate: 0
    question: "First taxable year with production/resale activities?"
    answer_type: bool
    maps_to: profile.is_first_263a_year
    kind: FACT
    authority: "Phase E Gate 0 Q0.5; §1.263A-7(a)"
    ask_when: "True"
    consequence: "If yes: methods below are ADOPTED (no Form 3115); skip Q0.6/Q0.6a."

  - id: Q0.6
    gate: 0
    question: "Established §263A method last year (and established sub-elections)?"
    answer_type: enum
    choices: [SPM, MSPM, SRM, facts_and_circumstances, none_noncompliant]
    maps_to: profile.prior_year_method
    kind: FACT
    authority: "Phase E Gate 0 Q0.6; §446(e); §1.263A-7"
    ask_when: "not Q0_5 and not small_business_exempt"
    consequence: >-
      Any divergence from this year's METHOD-OF-ACCOUNTING answers emits
      METHOD-CHANGE-3115-481A-REQUIRED plus the §1.263A-7 revalued-beginning-inventory
      input-contract notice.

  - id: Q0.6a
    gate: 0
    question: "RECONCILIATION (computed by the runner, never asked): was the prior-year method legally available under Gate 1's consequence matrix?"
    answer_type: bool
    maps_to: none
    kind: FACT
    authority: "Phase E Gate 0 Q0.6a; §446(e); error-correction Rev. Proc. posture"
    ask_when: "False"
    consequence: >-
      Runner-computed after Gate 1: if prior_year_method was never legally available
      (e.g. SRM when srm_available is False) or was none_noncompliant, emit
      PRIOR-METHOD-IMPERMISSIBLE (discovered impermissible method — 3115 with a
      different DCN/§481(a) posture than an elective switch).

  # ---------------------------------------------------------------- Gate 1 --
  - id: Q1.1a
    gate: 1
    question: "Produces real or tangible personal property?"
    answer_type: bool
    maps_to: profile.produces
    kind: FACT
    authority: "Phase E Gate 1 Q1.1; §1.263A-2(a)"
    ask_when: "True"

  - id: Q1.1b
    gate: 1
    question: "Acquires property for resale?"
    answer_type: bool
    maps_to: profile.acquires_for_resale
    kind: FACT
    authority: "Phase E Gate 1 Q1.1; §1.263A-3(a)"
    ask_when: "True"

  - id: Q1.2
    gate: 1
    question: "Production gross receipts and production labor as shares of the trade or business — 10%/10% presumption; above either, facts-and-circumstances follow-up (SME judgment)?"
    answer_type: enum
    choices: [de_minimis, more_than_de_minimis]
    maps_to: profile.production_activity_level
    kind: FACT
    authority: "Phase E Gate 1 Q1.2; §1.263A-3(a)(5)(ii)"
    ask_when: "Q1_1a and Q1_1b"
    consequence: "Above the presumption -> facts-and-circumstances follow-up is a review-queue SME call, not a formula."

  - id: Q1.3
    gate: 1
    question: "Is the (de minimis) production incident to resale of §1221(a)(1) property?"
    answer_type: bool
    maps_to: profile.production_incident_to_resale
    kind: FACT
    authority: "Phase E Gate 1 Q1.3; §1.263A-3(a)(4)(ii)"
    ask_when: "Q1_2 == 'de_minimis'"

  - id: Q1.4
    gate: 1
    question: "Private-label production (produced under contract by an UNRELATED party, incident to resale, sold to customers)?"
    answer_type: bool
    maps_to: profile.private_label_goods
    kind: FACT
    authority: "Phase E Gate 1 Q1.4; §1.263A-3(a)(4)(iii)"
    ask_when: "True"
    consequence: >-
      Asked ALWAYS (not gated on Q1.3): private-label is the carve-out that can
      qualify a MORE-than-de-minimis producer for SRM. Consequence matrix (computed,
      not asked): srm_available = pure reseller, or de-minimis-incident, or
      private-label; otherwise SPM/MSPM only (SRM-METHOD-CONFLICT if SRM chosen).

  # ---------------------------------------------------------------- Gate 2 --
  - id: Q2.1
    gate: 2
    question: "Inventory method?"
    answer_type: enum
    choices: [FIFO, lifo_specific, lifo_dollar_value]
    maps_to: profile.inventory_method
    kind: FACT
    authority: "Phase E Gate 2 Q2.1; §471/§472 (established method)"
    ask_when: "True"

  - id: Q2.1a
    gate: 2
    question: "LIFO layer detail (per layer: year, §471 cost, increment/decrement)?"
    answer_type: per_item
    maps_to: schedule.lifo_layers
    kind: FACT
    authority: "Phase E Gate 2 Q2.1 (layer detail); §1.263A-2(b)(3)(iii)/(c)(3)(iv)"
    ask_when: "Q2_1 and Q2_1 != 'FIFO'"

  - id: Q2.2
    gate: 2
    question: "§263A method this year?"
    answer_type: enum
    choices: [SPM, MSPM, SRM]
    maps_to: profile.method
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 2 Q2.2; §1.263A-2 (SPM/MSPM); §1.263A-3 (SRM)"
    ask_when: "True"
    consequence: >-
      Menu constrained by Gate 1's srm_available matrix — SRM chosen while
      srm_available is False emits SRM-METHOD-CONFLICT. Differing from Q0.6 in a
      non-first year emits METHOD-CHANGE-3115-481A-REQUIRED.

  - id: Q2.3
    gate: 2
    question: "(SPM only) 3-yr average gross receipts over $50M?"
    answer_type: bool
    maps_to: flag.SPM_OVER_50M
    kind: FACT
    authority: "Phase E Gate 2 Q2.3; §1.263A-1(d)(3)(ii)(B)(1)"
    ask_when: "Q2_2 == 'SPM'"
    consequence: "If yes: negative §263A adjustments barred under SPM (skip Q2.4); else Q2.4."

  - id: Q2.4
    gate: 2
    question: "Include negative §263A adjustments?"
    answer_type: bool
    maps_to: profile.include_negative_263a
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 2 Q2.4; §1.263A-1(d)(3)(ii)"
    ask_when: "Q2_2 and not (Q2_2 == 'SPM' and Q2_3)"
    warning_if_true: "NEGATIVE-263A-RESTRICTIONS (§1.263A-1(d)(3)(ii)(C)-(E)): no negatives for cash/trade discounts or §162(c)/(e)/(f)/(g) items; consistency required"
    consequence: >-
      Warn on the (d)(3)(ii)(C)-(E) restrictions: no negatives for cash/trade
      discounts or §162(c)/(e)/(f)/(g) items; consistency required.

  - id: Q2.5
    gate: 2
    question: "(Producers) Total indirect costs <= $200,000 (after excluding not-required-to-capitalize categories; related parties aggregated)?"
    answer_type: bool
    maps_to: profile.producer_de_minimis_200k
    kind: FACT
    authority: "Phase E Gate 2 Q2.5; §1.263A-2(b)(3)(iv)"
    ask_when: "Q1_1a"
    consequence: "If yes: de-minimis ZERO additional §263A — skip Q2.6-Q2.8 and Gate 3's ratio inputs."

  - id: Q2.6a
    gate: 2
    question: "(MSPM) 3+ consecutive prior years on MSPM with actual ratios?"
    answer_type: bool
    maps_to: flag.MSPM_3YR_ACTUAL_RATIO_HISTORY
    kind: FACT
    authority: "Phase E Gate 2 Q2.6 (eligibility fact); §1.263A-2(c)(4)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q2.6b
    gate: 2
    question: "Historic Absorption Ratio (HAR) election?"
    answer_type: bool
    maps_to: profile.har_election
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 2 Q2.6; §1.263A-2(c)(4) (MSPM-only mechanic; cut-off basis)"
    ask_when: "Q2_2 == 'MSPM' and Q2_6a and not Q2_5"
    consequence: "If elected: ratio/qualifying-year inputs required; HAR is MSPM-only."

  - id: Q2.6c
    gate: 2
    question: "HAR: frozen pre-production historic absorption ratio (fraction)?"
    answer_type: decimal
    maps_to: profile.har_preprod_ratio
    kind: FACT
    authority: "§1.263A-2(c)(4) (frozen for the 5-year qualifying period)"
    ask_when: "Q2_6b and Q2_1 == 'FIFO'"

  - id: Q2.6d
    gate: 2
    question: "HAR: frozen production historic absorption ratio (fraction)?"
    answer_type: decimal
    maps_to: profile.har_production_ratio
    kind: FACT
    authority: "§1.263A-2(c)(4)"
    ask_when: "Q2_6b and Q2_1 == 'FIFO'"

  - id: Q2.6e
    gate: 2
    question: "HAR (LIFO): frozen COMBINED historic absorption ratio (fraction)?"
    answer_type: decimal
    maps_to: profile.har_combined_ratio
    kind: FACT
    authority: "§1.263A-2(c)(4)(iii)"
    ask_when: "Q2_6b and Q2_1 and Q2_1 != 'FIFO'"

  - id: Q2.6f
    gate: 2
    question: "HAR: qualifying-year index (1-5 within the qualifying period; 6 = recomputation year)?"
    answer_type: int
    maps_to: profile.har_qualifying_year_index
    kind: FACT
    authority: "§1.263A-2(c)(4): recomputation-year ±0.5pp conjunctive test; pass extends 6 years; fail -> actuals now, mandatory resumption in the 3rd following year"
    ask_when: "Q2_6b"

  - id: Q2.7a
    gate: 2
    question: "(MSPM) SSCM-split method — direct-material or labor?"
    answer_type: enum
    choices: [direct_material, labor]
    maps_to: profile.mspm_mixed_split_method
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 2 Q2.7; §1.263A-2(c)(3)(iii)(B)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q2.7b
    gate: 2
    question: "(MSPM) 90% one-bucket split election?"
    answer_type: bool
    maps_to: profile.mspm_90pct_split_election
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 2 Q2.7; §1.263A-2(c)(3)(iii)(C)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q2.8a
    gate: 2
    question: "SSCM (simplified service cost method) elected?"
    answer_type: bool
    maps_to: flag.SSCM_ELECTED
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 2 Q2.8; §1.263A-1(h)"
    ask_when: "not Q2_5"

  - id: Q2.8b
    gate: 2
    question: "SSCM ratio method (production-cost offered ONLY to producers per (h)(3)(ii))?"
    answer_type: enum
    choices: [labor, production_cost]
    maps_to: profile.sscm_ratio_method
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 2 Q2.8; §1.263A-1(h)(3)(ii)"
    ask_when: "Q2_8a and not Q2_5"
    consequence: "production_cost is only available to producers ((h)(3)(ii))."

  - id: Q2.8c
    gate: 2
    question: "SSCM exclude-self-constructed-assets election?"
    answer_type: bool
    maps_to: flag.SSCM_EXCLUDE_SELF_CONSTRUCTED
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 2 Q2.8; §1.263A-1(h)(2)(ii)"
    ask_when: "Q2_8a and not Q2_5"
    consequence: "Routes SCA mixed costs to the general (g)(4) method instead of SSCM."

  - id: Q2.8d
    gate: 2
    question: "(g)(4)(ii) all-departments 90% mixed-service election?"
    answer_type: bool
    maps_to: flag.MSC_90_10_ELECTION
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 2 Q2.8; §1.263A-1(g)(4)(ii)"
    ask_when: "Q2_8a and not Q2_5"

  - id: Q2.9
    gate: 2
    question: "Book-conformity check (§1.263A-1(d)(2)): does financial-statement capitalization match the classifier's §471/Additional tier split (incl. TD 9843 elective methods (d)(2)(iii)/(iv)/(v))?"
    answer_type: bool
    maps_to: flag.BOOK_CONFORMITY_REVIEW
    kind: FACT
    authority: "Phase E Gate 2 Q2.9; §1.263A-1(d)(2); TD 9843"
    ask_when: "True"
    consequence: "Review-queue flags, not fields (flag-don't-model per Phase B)."

  # ---------------------------------------------------------------- Gate 3 --
  # Menu strictly follows Q2.2 (SPM -> Q3.1 only; MSPM -> Q3.2-Q3.10;
  # SRM -> Q3.11-Q3.22). Ratio inputs suppressed when Q2.5 deemed-zero applies.
  - id: Q3.1
    gate: 3
    question: "(SPM) §471 costs remaining in ending inventory?"
    answer_type: decimal
    maps_to: profile.ending_inventory_471
    kind: FACT
    authority: "Phase E Gate 3 Q3.1; §1.263A-2(b)"
    ask_when: "Q2_2 == 'SPM' and not Q2_5"

  - id: Q3.2
    gate: 3
    question: "(MSPM) Pre-production §471 costs incurred during the year (direct material + resale)?"
    answer_type: decimal
    maps_to: profile.pre_production_471
    kind: FACT
    authority: "Phase E Gate 3 Q3.2; §1.263A-2(c)(3)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q3.3
    gate: 3
    question: "(MSPM) Production §471 costs incurred during the year?"
    answer_type: decimal
    maps_to: profile.production_471
    kind: FACT
    authority: "Phase E Gate 3 Q3.3; §1.263A-2(c)(3)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q3.4
    gate: 3
    question: "(MSPM) Pre-production additional §263A costs incurred?"
    answer_type: decimal
    maps_to: profile.pre_production_additional_263A
    kind: FACT
    authority: "Phase E Gate 3 Q3.4; §1.263A-2(c)(3)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q3.5
    gate: 3
    question: "(MSPM) Production additional §263A costs incurred?"
    answer_type: decimal
    maps_to: profile.production_additional_263A
    kind: FACT
    authority: "Phase E Gate 3 Q3.5; §1.263A-2(c)(3)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q3.6
    gate: 3
    question: "(MSPM) Pre-production §471 costs on hand at year end (current-year-incurred only)?"
    answer_type: decimal
    maps_to: profile.pre_production_471_on_hand
    kind: FACT
    authority: "Phase E Gate 3 Q3.6; §1.263A-2(c)(3)(ii)(C)/(E)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q3.7
    gate: 3
    question: "(MSPM) Production §471 costs on hand at year end (current-year-incurred only)?"
    answer_type: decimal
    maps_to: profile.production_471_on_hand
    kind: FACT
    authority: "Phase E Gate 3 Q3.7; §1.263A-2(c)(3)(ii)(C)/(E)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q3.8
    gate: 3
    question: "(MSPM) Beginning direct materials not yet in production?"
    answer_type: decimal
    maps_to: profile.beginning_DM_not_yet_in_production
    kind: FACT
    authority: "Phase E Gate 3 Q3.8; §1.263A-2(c)(3)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q3.9
    gate: 3
    question: "(MSPM) Ending direct materials not yet in production?"
    answer_type: decimal
    maps_to: profile.ending_DM_not_yet_in_production
    kind: FACT
    authority: "Phase E Gate 3 Q3.9; §1.263A-2(c)(3)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q3.10
    gate: 3
    question: "(MSPM) Direct materials purchased during the year?"
    answer_type: decimal
    maps_to: profile.DM_purchased_during_year
    kind: FACT
    authority: "Phase E Gate 3 Q3.10 (ADDED 2026-07-09); feeds direct_materials_adjustment"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5"

  - id: Q3.10a
    gate: 3
    question: "(MSPM, LIFO) Current-year LIFO increment stated in §471 costs (the combined absorption ratio's multiplicand)?"
    answer_type: decimal
    maps_to: profile.lifo_current_year_increment_471
    kind: FACT
    authority: "§1.263A-2(c)(3)(iv) (the regulation's Example 3: 9.48% combined ratio x 1,500,000 increment)"
    ask_when: "Q2_2 == 'MSPM' and not Q2_5 and Q2_1 and Q2_1 != 'FIFO'"

  - id: Q3.11
    gate: 3
    question: "(SRM) Current year's purchases — §471 costs incurred on property acquired for resale during the year (purchasing-ratio DENOMINATOR)?"
    answer_type: decimal
    maps_to: profile.current_year_471_costs
    kind: FACT
    authority: "Phase E Gate 3 Q3.11; §1.263A-3(d)(3)"
    ask_when: "Q2_2 == 'SRM' and not Q2_5"

  - id: Q3.12
    gate: 3
    question: "(SRM) Purchasing-department cost pool (purchasing-ratio NUMERATOR)?"
    answer_type: decimal
    maps_to: profile.purchasing_costs
    kind: FACT
    authority: "Phase E Gate 3 Q3.12 (ADDED 2026-07-09); §1.263A-3(d)(3)"
    ask_when: "Q2_2 == 'SRM' and not Q2_5"

  - id: Q3.13
    gate: 3
    question: "(SRM) Storage & handling costs?"
    answer_type: decimal
    maps_to: profile.storage_handling_costs
    kind: FACT
    authority: "Phase E Gate 3 Q3.13; §1.263A-3(d)(3)"
    ask_when: "Q2_2 == 'SRM' and not Q2_5"

  - id: Q3.14
    gate: 3
    question: "(SRM) Beginning inventory §471 costs (LIFO carrying value if Q2.1 = LIFO)?"
    answer_type: decimal
    maps_to: profile.beginning_inventory_471
    kind: FACT
    authority: "Phase E Gate 3 Q3.14; §1.263A-3(d)(3)"
    ask_when: "Q2_2 == 'SRM' and not Q2_5"

  - id: Q3.15
    gate: 3
    question: "(SRM) §471 costs remaining on hand at year end (LIFO: current-year increment, unless Q3.18b Variation B elected)?"
    answer_type: decimal
    maps_to: profile.ending_inventory_471
    kind: FACT
    authority: "Phase E Gate 3 Q3.15 (ADDED 2026-07-09); §1.263A-3(d)(3)(i)(C)"
    ask_when: "Q2_2 == 'SRM' and not Q2_5"

  - id: Q3.16
    gate: 3
    question: "(SRM) 1/3-2/3 purchasing-labor election (all-or-nothing)?"
    answer_type: bool
    maps_to: flag.SRM_ONE_THIRD_TWO_THIRDS_ELECTION
    kind: ELECTION
    authority: "Phase E Gate 3 Q3.16; §1.263A-3(d)"
    ask_when: "Q2_2 == 'SRM' and not Q2_5"

  - id: Q3.17
    gate: 3
    question: "(SRM) Write-down carve-out scope — which write-downs are excluded from the S&H cost pool?"
    answer_type: str
    maps_to: none
    kind: FACT
    authority: "Phase E Gate 3 Q3.17; §1.263A-3(d)"
    ask_when: "Q2_2 == 'SRM' and not Q2_5"

  - id: Q3.18a
    gate: 3
    question: "(SRM) Permissible variation A — exclude beginning inventory from the S&H denominator?"
    answer_type: bool
    maps_to: profile.srm_variation_a
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 3 Q3.18; §1.263A-3(d)(3)(iii)(A)"
    ask_when: "Q2_2 == 'SRM' and not Q2_5"

  - id: Q3.18b
    gate: 3
    question: "(SRM, LIFO) Permissible variation B — multiply by total ending-inventory §471 costs instead of the increment?"
    answer_type: bool
    maps_to: profile.srm_variation_b
    kind: METHOD-OF-ACCOUNTING
    authority: "Phase E Gate 3 Q3.18; §1.263A-3(d)(3)(iii)(B)"
    ask_when: "Q2_2 == 'SRM' and not Q2_5 and Q2_1 and Q2_1 != 'FIFO'"

  # Per-facility sub-tree (SRM only; repeats per facility)
  - id: Q3.19
    gate: 3
